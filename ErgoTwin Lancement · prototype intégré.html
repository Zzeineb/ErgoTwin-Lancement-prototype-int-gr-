<style>:root{--bg:#F4F6F8;--card:#fff;--ink:#17212B;--mut:#5B6877;--ln:#DDE3E9;--g:#2FB56F;--o:#F5A524;--r:#E5484D;--b:#2F6FD0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}

.top .btn{background:#2B3A5C;border-color:#2B3A5C;color:#fff}

.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.note{color:var(--mut);font-size:12.5px;margin-top:6px}.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.chk{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;cursor:pointer}.chk.big{font-size:14px;margin:6px 0;display:flex}

table{border-collapse:collapse;width:100%}th{text-align:left;font-size:11.5px;color:var(--mut);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--ln)}td{padding:8px;border-bottom:1px solid var(--ln);vertical-align:middle}.tablewrap{overflow-x:auto}

.kpi span{color:var(--mut);font-size:12.5px}.kpi b{font-size:28px;font-variant-numeric:tabular-nums}.kpi small{font-size:14px;color:var(--mut);font-weight:600}.kpi em{font-style:normal;font-size:12px;color:var(--mut)}
.headline{font-size:17px;font-weight:600;margin:4px 0 12px}
.tabs{display:flex;gap:6px;margin:8px 0 12px;overflow-x:auto}.tabs button{border:1px solid var(--ln);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;white-space:nowrap}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.tabs.sm button{padding:6px 10px;font-size:12.5px;font-weight:500}
.etop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}.who{font-size:12.5px;color:var(--mut)}
.login{max-width:440px;margin:40px auto}.login form{display:grid;gap:10px;margin-top:14px}.login label{display:grid;gap:4px;font-weight:600;font-size:13px}.login input{font:inherit;padding:9px 11px;border:1px solid var(--ln);border-radius:9px}.err{color:var(--r);font-weight:600;min-height:18px}
/* jumeau */
.twin-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px}.twin{position:relative;height:620px;border-radius:14px;overflow:hidden;background:#EEF0F2;border:1px solid var(--ln)}
.twin canvas.gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}.twin .labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);font-size:11px;white-space:nowrap;padding:2px 6px;border-radius:5px;background:rgba(20,33,61,.82);color:#fff}
.stag{position:absolute;transform:translate(-50%,-110%);display:flex;gap:4px;align-items:center;background:#fff;border-radius:99px;padding:2px 7px;font-size:11px;box-shadow:0 2px 8px rgba(0,0,0,.15);white-space:nowrap}.stag i{width:9px;height:9px;border-radius:50%;display:block}.stag em{color:var(--r);font-style:normal;font-weight:700}
.tw-tools{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);border:1px solid var(--ln);border-radius:12px;padding:6px 10px;max-width:calc(100% - 20px)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tile{border-radius:10px;padding:7px;background:#F4F6F8}.tile b{display:block;font-size:18px}.tile span{font-size:11px;color:var(--mut)}.tile.G b{color:#1E8A52}.tile.O b{color:#B7791F}.tile.R b{color:var(--r)}
.lrow{display:grid;grid-template-columns:12px 34px 1fr;gap:2px 8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln)}.lrow i{width:10px;height:10px;border-radius:50%}.lrow small{grid-column:2/4;color:var(--mut)}.zbar{grid-column:2/4;display:flex;gap:3px}.zbar span{height:7px;border-radius:4px}.zbar .R{background:var(--r)}.zbar .O{background:var(--o)}.zbar .G{background:var(--g)}
.prevbox{border-color:var(--b);background:#EEF4FD}
.rec{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.tg{font-size:11.5px;background:#F0F2F5;border-radius:6px;padding:2px 7px}.tg.n{background:#E6EEFB;color:#2453A6}.tg.m{background:#E3F5EC;color:#1E7A4A}
.spark{width:90px;height:24px;color:#5B6877}
.wi{display:grid;grid-template-columns:360px minmax(0,1fr);gap:12px;align-items:start}.rg{display:grid;gap:3px;margin:10px 0}.rg input[type=range]{width:100%;accent-color:var(--g)}.rg small{color:var(--mut);font-size:11.5px}.rg input[type=number]{font:inherit;padding:6px 8px;border:1px solid var(--ln);border-radius:8px}
.verdicts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:12px}.vd{border-radius:12px;padding:10px 12px;background:#F4F6F8;display:grid;gap:4px}.vd.ok{background:#E3F5EC}.vd.bad{background:#FDE8E9}.vd small{color:var(--mut)}
/* médecin */
.drow .row{all:unset;display:flex;gap:12px;align-items:center;width:100%;cursor:pointer}.rk{width:28px;height:28px;border-radius:50%;background:#EEF2F6;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}.nm{flex:1;min-width:0}.nm small{display:block;color:var(--mut)}
.bar{height:7px;background:#EEF2F6;border-radius:8px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%}.det{display:none;margin-top:10px;border-top:1px dashed var(--ln);padding-top:10px}.drow.open .det{display:block}
.zline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.zline small{color:var(--mut)}.fl{display:inline-block;background:#F0F2F5;border-radius:7px;padding:2px 7px;font-size:11.5px}.fl.on{background:var(--r);color:#fff}
.hist{display:flex;align-items:flex-end;gap:2px;height:30px}.hist i{flex:1;background:var(--o);border-radius:2px 2px 0 0}
.rules li{margin:5px 0}
/* liaison */
.arch{width:100%;max-width:1000px;height:auto;display:block;margin:0 auto}.arch .zone{fill:none;stroke:#C9D2DC;stroke-dasharray:4 4}.arch .zt{font-size:10.5px;fill:#7B8794}.arch .nd rect{fill:#fff;stroke:#9DB0C6}.arch .t1{font-size:12px;font-weight:700;fill:#17212B}.arch .t2{font-size:10px;fill:#5B6877}.arch .cnt{font-size:11px;fill:#2F6FD0;font-weight:700}
.arch .ed{stroke:#B5C0CC;stroke-width:1.6}.arch .ed.hot{animation:hot 1.1s ease-out}@keyframes hot{0%{stroke:#2FB56F;stroke-width:5}100%{stroke:#B5C0CC;stroke-width:1.6}}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.log{max-height:520px;overflow:auto;font-size:12px}.lg{border-bottom:1px solid var(--ln);padding:5px 0;display:grid;grid-template-columns:44px 1fr;gap:2px 8px}.lg .ts{color:var(--mut)}.lg .fr{grid-column:2;color:var(--mut);font-size:11px}.lg pre{grid-column:2;margin:0;white-space:pre-wrap;word-break:break-all;font-size:11px;color:#34495E}.lg.priv pre{color:#7A5300}
#lf{font:inherit;font-weight:400;font-size:12px;padding:4px 8px;border:1px solid var(--ln);border-radius:8px;width:240px}
.wiring{width:100%;height:auto}.wiring .pcb{fill:#1F3B57}.wiring .sensor{fill:#3A3F47}.wiring .psu{fill:#F4F6F8;stroke:#C9D2DC}.wiring .h{font-size:12.5px;font-weight:700;fill:#17212B}.wiring .p{font-size:11px;fill:#17212B}.wiring .p2{font-size:10px;fill:#5B6877}
.wiring .w{font-size:12px;fill:#fff;font-weight:600}

.kdemo{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#14213D;color:#fff;border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:12.5px}.kdemo b{margin-right:8px}.kdemo button{background:#2B3A5C;color:#fff;border:0;border-radius:8px;padding:6px 10px}.kdemo button.on{background:var(--g)}.kdemo .sep{flex:1}
.ktab{display:flex;flex-direction:column;align-items:center}.kframe{width:min(100%,860px);aspect-ratio:16/10;background:#111;border-radius:30px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#k-app{width:100%;height:100%;background:#fff;border-radius:16px;overflow:auto}
.kpt{min-height:100%;display:flex;align-items:center;justify-content:center;padding:22px;text-align:center;color:#111}.kpt.rtl{direction:rtl}.kst{width:100%;max-width:620px}
.kpt .fp{width:200px;height:200px;border:0;background:none;padding:0;position:relative}.kpt .fp svg{width:100%;height:100%}.kpt .fp .ln{position:absolute;left:12%;right:12%;height:4px;background:#16a34a;border-radius:4px;box-shadow:0 0 14px #16a34a;top:15%;opacity:0}
.kpt .fp.scan .ln{opacity:1;animation:sc 1s ease-in-out infinite alternate}@keyframes sc{to{top:80%}}.kpt .fp:not(.scan){animation:pl 2.2s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.04)}}

.zcs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.zc{border-radius:14px;padding:10px 6px;display:grid;gap:2px;border:2px solid}.zc b{font-size:14px}.zc span{font-weight:700}.zc small{font-size:11.5px;color:#444}.zc.G{border-color:#16a34a;background:#f0fdf4}.zc.O{border-color:#d97706;background:#fffbeb}.zc.R{border-color:#dc2626;background:#fef2f2}

.alert{background:#fff7ed;border:2px solid #d97706;color:#7c2d12;border-radius:16px;padding:14px 16px;font-size:18px;line-height:1.6;margin-bottom:18px}
.dots{display:flex;gap:8px;justify-content:center;margin:0 0 10px}.dots i{width:11px;height:11px;border-radius:50%;background:#d1d5db}.dots i.d{background:#16a34a}.grp{display:inline-block;background:#16a34a;color:#fff;border-radius:20px;padding:4px 18px;font-size:16px;font-weight:700}

<header class="top">
  <div class="brand"><b>ErgoTwin</b><span>Poste Lancement · TLS · prototype intégré</span></div>

    <button id="play" class="btn sm">⏸</button>
    <select id="speed" class="btn sm"><option value="30">×30</option><option value="60" selected>×60</option><option value="180">×180</option><option value="600">×600</option></select>
    <button id="eod" class="btn sm">Aller à 16h55</button>

</header>
<div class="demo-note">Prototype de démonstration : les angles viennent d'un modèle de tâche qui simule le pipeline vision, avec des données d'exemple. Aucune vidéo, aucun visage, aucune donnée réelle.</div>

  <section class="view" id="v-kiosk"></section>
  <section class="view" id="v-engineer" hidden></section>
  <section class="view" id="v-doctor" hidden></section>
  <section class="view" id="v-liaison" hidden></section>
</main>

      const x = x0 + 0.06 + (x1 - x0 - 0.12) * i / (legs - 1);
      for (const y of [y0 + 0.06, y1 - 0.06]) B.box(x - 0.025, y - 0.025, 0, x + 0.025, y + 0.025, z1 - t, C.steelDark);
    }
    B.box(x0 + 0.05, y0 + 0.08, 0.16, x1 - 0.05, y1 - 0.08, 0.19, C.steelDark);  // lower shelf
    // work items: black product bags and white sheets, one set per ~0.95 m
    const n = Math.max(1, Math.floor(o.w / 0.95));
    for (let i = 0; i < n; i++) {
      const cx = x0 + (i + 0.5) * o.w / n, cy = (y0 + y1) / 2;
      B.box(cx - 0.2, cy - 0.17, z1, cx + 0.2, cy + 0.15, z1 + 0.14 + 0.04 * (i % 2), C.black);
      B.box(cx + 0.24, cy - 0.15, z1, cx + 0.45, cy + 0.15, z1 + 0.004, C.paper);
    }
  }

  function rack(B, o) {
    const x0 = o.x, x1 = o.x + o.w, y0 = o.y, y1 = o.y + o.h, H = o.height, u = 0.04;
    const bays = Math.max(1, Math.round(o.w / 1.15));
    for (let i = 0; i <= bays; i++) {
      const x = x0 + (x1 - x0) * i / bays;
      for (const y of [y0 + u, y1 - u]) B.box(x - u, y - u, 0, x + u, y + u, H, C.rackBlue);
    }
    const levels = [0.12, 1.15, 2.2].filter(z => z < H - 0.5);
    for (const z of levels) {
      for (const y of [y0 + u, y1 - u]) B.box(x0, y - u, z, x1, y + u, z + 0.1, C.rackOrange);
      B.box(x0 + u, y0 + u, z + 0.1, x1 - u, y1 - u, z + 0.12, C.steelDark);
    }
    for (let i = 0; i < bays; i++) for (let k = 0; k < levels.length; k++) {
      const bx0 = x0 + (x1 - x0) * i / bays + 0.08, bx1 = x0 + (x1 - x0) * (i + 1) / bays - 0.08;
      const z0 = levels[k] + 0.12, top = (k + 1 < levels.length ? levels[k + 1] : H) - 0.08;
      const zt = z0 + Math.min(0.85, top - z0);
      B.box(bx0, y0 + 0.1, z0, bx1, y1 - 0.1, zt, (i + k) % 2 ? C.goods : C.goods2);
    }
  }

  function cage(B, o, mesh) {
    const x0 = o.x, x1 = o.x + o.w, y0 = o.y, y1 = o.y + o.h, H = o.height, r = 0.02;
    for (const [x, y] of [[x0, y0], [x1, y0], [x1, y1], [x0, y1]]) B.box(x - r, y - r, 0.08, x + r, y + r, H, C.cage);
    for (const z of [0.1, H / 2, H]) {
      B.box(x0, y0 - r, z - r, x1, y0 + r, z + r, C.cage); B.box(x0, y1 - r, z - r, x1, y1 + r, z + r, C.cage);
      B.box(x0 - r, y0, z - r, x0 + r, y1, z + r, C.cage); B.box(x1 - r, y0, z - r, x1 + r, y1, z + r, C.cage);
    }
    for (const [x, y] of [[x0 + 0.1, y0 + 0.1], [x1 - 0.1, y0 + 0.1], [x1 - 0.1, y1 - 0.1], [x0 + 0.1, y1 - 0.1]]) B.cyl(x, y, 0, 0.08, 0.05, C.black, 8);
    // contents
    B.box(x0 + 0.15, y0 + 0.15, 0.12, x1 - 0.15, y1 - 0.15, 0.7, C.goods);
    B.box(x0 + 0.15, y0 + 0.15, H / 2 + 0.02, x1 - 0.4, y1 - 0.3, H / 2 + 0.55, C.goods2);
    // wire mesh walls (translucent group)
    mesh.push([x0, y0, x1, y1, H]);
  }

  function crate(B, o) {
    const cols = Math.max(1, Math.round(o.w / 0.6)), lv = Math.max(1, Math.round(o.height / 0.36));
    for (let i = 0; i < cols; i++) for (let k = 0; k < lv; k++) {
      const x0 = o.x + o.w * i / cols + 0.01, x1 = o.x + o.w * (i + 1) / cols - 0.01;
      const z0 = o.height * k / lv + 0.005, z1 = o.height * (k + 1) / lv - 0.005;
      B.box(x0, o.y + 0.01, z0, x1, o.y + o.h - 0.01, z1, (i + k) % 2 ? C.white : C.white2);
    }
  }

  function desk(B, o) {
    const x0 = o.x, x1 = o.x + o.w, y0 = o.y, y1 = o.y + o.h, z = 0.78;
    B.box(x0, y0, z - 0.03, x1, y1, z, C.white);
    B.box(x0 + 0.03, y0 + 0.03, 0.2, x1 - 0.03, y1 - 0.03, 0.23, C.white2);
    for (const [x, y] of [[x0 + 0.04, y0 + 0.04], [x1 - 0.04, y0 + 0.04], [x1 - 0.04, y1 - 0.04], [x0 + 0.04, y1 - 0.04]]) {
      B.box(x - 0.02, y - 0.02, 0.08, x + 0.02, y + 0.02, z - 0.03, C.steelDark); B.cyl(x, y, 0, 0.08, 0.04, C.black, 8);
    }
    const mx = x1 - 0.12, my = (y0 + y1) / 2;
    B.box(mx - 0.03, my - 0.04, z, mx + 0.03, my + 0.04, z + 0.25, C.black);
    B.box(mx - 0.05, my - 0.28, z + 0.22, mx + 0.0, my + 0.28, z + 0.56, C.black);
    B.box(mx - 0.056, my - 0.25, z + 0.25, mx - 0.05, my + 0.25, z + 0.53, C.screen);
    B.box(x0 + 0.12, my - 0.22, z, x0 + 0.32, my + 0.22, z + 0.02, C.black);
    B.box(x0 + 0.1, y0 + 0.1, 0.23, x1 - 0.1, y1 - 0.2, 0.5, C.black);   // printer / PC
    if (o.height > 1.3) return;
  }

  function pillar(B, o) {
    B.box(o.x, o.y, 0, o.x + o.w, o.y + o.h, o.height, C.white);
    const fx = o.x + o.w * 0.65, fy = o.y + o.h;
    B.box(fx - 0.15, fy, 0.9, fx + 0.15, fy + 0.12, 1.5, C.red);
  }

  function bin(B, o) {
    const z = o.z || 0, H = o.height || 0.2, t = 0.015;
    B.box(o.x, o.y, z, o.x + o.w, o.y + o.h, z + t, C.bin);
    B.box(o.x, o.y, z, o.x + t, o.y + o.h, z + H, C.bin); B.box(o.x + o.w - t, o.y, z, o.x + o.w, o.y + o.h, z + H, C.bin);
    B.box(o.x, o.y, z, o.x + o.w, o.y + t, z + H, C.bin); B.box(o.x, o.y + o.h - t, z, o.x + o.w, o.y + o.h, z + H, C.bin);
    B.box(o.x + 0.04, o.y + 0.04, z + t, o.x + o.w - 0.04, o.y + o.h - 0.04, z + H * 0.75, C.paper);
  }

  function worker(B, w) {
    const COAT = w.color ? hex(w.color) : C.coat;   // ErgoTwin: colour = exposure level of the station (aggregated)
    if (w.color) B.cyl(w.x, w.y, 0.004, 0.02, 0.42, hex(w.color, 1), 20);
    const f = (w.facing == null ? 90 : w.facing) * Math.PI / 180, fx = Math.cos(f), fy = Math.sin(f);
    const sx = -fy, sy = fx, x = w.x, y = w.y, yaw = w.facing == null ? 90 : w.facing;
    if (w.pose === "sitting") {
      B.cyl(x - fx * 0.05, y - fy * 0.05, 0, 0.62, 0.035, C.stool, 8);
      B.cyl(x - fx * 0.05, y - fy * 0.05, 0.6, 0.66, 0.18, C.stool, 12);
      for (const s of [-1, 1]) {
        B.obox(x + fx * 0.18 + sx * s * 0.1, y + fy * 0.18 + sy * s * 0.1, 0.7, 0.22, 0.07, 0.07, yaw, 0, C.pants);
        B.cyl(x + fx * 0.38 + sx * s * 0.1, y + fy * 0.38 + sy * s * 0.1, 0.05, 0.68, 0.055, C.pants, 8);
        B.obox(x + fx * 0.3 + sx * s * 0.17, y + fy * 0.3 + sy * s * 0.17, 0.98, 0.2, 0.05, 0.05, yaw, 15, COAT);
      }
      B.cyl(x + fx * 0.03, y + fy * 0.03, 0.66, 1.2, 0.17, COAT, 12);
      B.sphere(x + fx * 0.1, y + fy * 0.1, 1.32, 0.105, C.skin);
      B.sphere(x + fx * 0.07, y + fy * 0.07, 1.36, 0.1, C.hair);
    } else {
      for (const s of [-1, 1]) B.cyl(x + sx * s * 0.08, y + sy * s * 0.08, 0, 0.85, 0.065, C.pants, 8);
      B.cyl(x, y, 0.8, 1.48, 0.19, COAT, 12);
      for (const s of [-1, 1]) B.cyl(x + sx * s * 0.23, y + sy * s * 0.23, 0.85, 1.42, 0.05, COAT, 8);
      B.sphere(x, y, 1.6, 0.11, C.skin);
      B.sphere(x - fx * 0.02, y - fy * 0.02, 1.64, 0.105, C.hair);
    }
  }

  function cart(B, o, mesh) {
    cage(B, { x: o.x, y: o.y, w: o.w, h: o.h, height: o.height || 1.1 }, mesh);
  }

  function cameraModel(B, cam, floor, frustumGroup) {
    const yaw = cam.yaw || 0, pitch = cam.pitch == null ? 35 : cam.pitch, h = cam.height || 2.5;
    B.obox(cam.x, cam.y, h, 0.17, 0.08, 0.08, yaw, pitch, C.cam);
    const fy = Math.cos(yaw * Math.PI / 180), fx = Math.sin(yaw * Math.PI / 180);
    B.obox(cam.x + fy * 0.18, cam.y + fx * 0.18, h - 0.05, 0.03, 0.05, 0.05, yaw, pitch, C.black);
    // bracket up to the ceiling / wall
    const top = Math.min(floor.room_height || h + 0.6, h + 0.6);
    B.box(cam.x - 0.025, cam.y - 0.025, h + 0.06, cam.x + 0.025, cam.y + 0.025, top, C.cam);
    return frustumCorners(cam, floor);
  }

  function frustumCorners(cam, room) {
    const yaw = (cam.yaw || 0) * Math.PI / 180, pitch = (cam.pitch == null ? 35 : cam.pitch) * Math.PI / 180;
    const hf = (cam.fov || 70) * Math.PI / 360;
    const vf = (cam.vfov != null ? cam.vfov : 2 * Math.atan(Math.tan(hf) * 9 / 16) * 180 / Math.PI) * Math.PI / 360;
    const f = [Math.cos(yaw) * Math.cos(pitch), Math.sin(yaw) * Math.cos(pitch), -Math.sin(pitch)];
    const r = [-Math.sin(yaw), Math.cos(yaw), 0];
    const u = [Math.cos(yaw) * Math.sin(pitch), Math.sin(yaw) * Math.sin(pitch), Math.cos(pitch)];
    const h = cam.height || 2.5, R = cam.range || 10, out = [];
    for (const [a, b] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      const d = [0, 1, 2].map(i => f[i] + r[i] * Math.tan(hf) * a + u[i] * Math.tan(vf) * b);
      const n = Math.hypot(d[0], d[1], d[2]);
      let t = R / n;                                   // clip at range
      if (d[2] < 0) t = Math.min(t, h / -d[2]);        // hit the floor
      if (room) {                                       // stop at the walls / ceiling
        if (d[0] < 0) t = Math.min(t, (0 - cam.x) / d[0]); if (d[0] > 0) t = Math.min(t, (room.width - cam.x) / d[0]);
        if (d[1] < 0) t = Math.min(t, (0 - cam.y) / d[1]); if (d[1] > 0) t = Math.min(t, (room.height - cam.y) / d[1]);
        if (d[2] > 0 && room.room_height) t = Math.min(t, (room.room_height - h) / d[2]);
      }
      out.push([cam.x + d[0] * t, cam.y + d[1] * t, h + d[2] * t]);
    }
    return out;
  }

  // ------------------------------------------------------------------ scene
  function buildScene(floor, opts) {
    opts = opts || {};
    const B = new Builder(), W = floor.width, H = floor.height, RH = floor.room_height || 4;
    // floor + markings
    B.group("Sol", { layer: "model" });
    B.box(0, 0, -0.05, W, H, 0, C.floor);
    for (const m of floor.markings || []) {
      const col = m.color ? hex(m.color) : C.yellow, wd = (m.width || 0.08) / 2;
      for (let i = 1; i < m.points.length; i++) {
        const [a, b] = [m.points[i - 1], m.points[i]];
        const L = Math.hypot(b[0] - a[0], b[1] - a[1]), yaw = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
        B.obox((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, 0.003, L / 2, wd, 0.003, yaw, 0, col);
      }
    }
    // walls: skirting (opaque) + translucent panels
    B.group("Plinthes", { layer: "walls" });
    B.box(-0.1, -0.1, 0, W + 0.1, 0, 0.12, C.wallBase);
    B.box(-0.1, 0, 0, 0, H, 0.12, C.wallBase);
    B.box(W, 0, 0, W + 0.1, H, 0.12, C.wallBase);
    B.group("Murs", { layer: "walls", transparent: true });
    B.box(-0.1, -0.1, 0.12, W + 0.1, 0, RH, C.wall);
    B.box(-0.1, 0, 0.12, 0, H, RH, C.wall);
    B.box(W, 0, 0.12, W + 0.1, H, RH, C.wall);
    // obstacles
    const mesh = [];
    for (const o of floor.obstacles || []) {
      B.group(o.label || o.id, { layer: "model" });
      if (o.type === "table") table(B, o);
      else if (o.type === "rack" || o.type === "stack") rack(B, o);
      else if (o.type === "cage") cage(B, o, mesh);
      else if (o.type === "crate") crate(B, o);
      else if (o.type === "desk") desk(B, o);
      else if (o.type === "pillar" || o.type === "wall") pillar(B, o);
      else B.box(o.x, o.y, 0, o.x + o.w, o.y + o.h, o.height || 1, C.steelDark);
      B.label(o.label || o.id, o.x + o.w / 2, o.y + o.h / 2, Math.min(o.height || 1, 3.4) + 0.25);
    }
    // props (decor, ignored by coverage)
    B.group("Objets", { layer: "model" });
    for (const pr of floor.props || []) {
      if (pr.type === "bin") bin(B, pr);
      else if (pr.type === "cart") cart(B, pr, mesh);
      else if (pr.type === "box") B.obox(pr.x + pr.w / 2, pr.y + pr.h / 2, (pr.z || 0) + (pr.height || 0.1) / 2, pr.w / 2, pr.h / 2, (pr.height || 0.1) / 2, pr.yaw || 0, pr.pitch || 0, hex(pr.color || "#8d949b"));
    }
    B.group("Opérateurs", { layer: "workers" });
    for (const pr of floor.props || []) if (pr.type === "worker") worker(B, pr);
    if (mesh.length) {
      B.group("Grillage", { layer: "model", transparent: true });
      for (const [x0, y0, x1, y1, Hh] of mesh) {
        B.box(x0, y0 - 0.004, 0.1, x1, y0 + 0.004, Hh, C.cageMesh); B.box(x0, y1 - 0.004, 0.1, x1, y1 + 0.004, Hh, C.cageMesh);
        B.box(x0 - 0.004, y0, 0.1, x0 + 0.004, y1, Hh, C.cageMesh); B.box(x1 - 0.004, y0, 0.1, x1 + 0.004, y1, Hh, C.cageMesh);
      }
    }
    // cameras + frustums
    const cams = (floor.cameras || []).concat(opts.extraCameras || []);
    const corners = [];
    for (const cam of cams) {
      B.group(cam.label || cam.id, { layer: "cameras", camId: cam.id });
      corners.push([cam, cameraModel(B, cam, floor)]);
      B.label(cam.label || cam.id, cam.x, cam.y, (cam.height || 2.5) + 0.45, "camera");
    }
    B.group("Champs caméra", { kind: "lines", layer: "frustum" });
    for (const [cam, cs] of corners) {
      const col = cam.suggested ? hex("#4ade80") : C.frustum, top = [cam.x, cam.y, cam.height || 2.5];
      for (let i = 0; i < 4; i++) { B.line(top, cs[i], col); B.line(cs[i], cs[(i + 1) % 4], col); }
    }
    // 1 m grid + zones (lines)
    B.group("Grille", { kind: "lines", layer: "grid" });
    for (let x = 1; x < W; x++) B.line([x, 0, 0.004], [x, H, 0.004], C.grid);
    for (let y = 1; y < H; y++) B.line([0, y, 0.004], [W, y, 0.004], C.grid);
    B.group("Zones", { kind: "lines", layer: "zones" });
    for (const z of floor.zones || []) {
      const p = [[z.x, z.y], [z.x + z.w, z.y], [z.x + z.w, z.y + z.h], [z.x, z.y + z.h]];
      for (let i = 0; i < 4; i++) B.line([p[i][0], p[i][1], 0.008], [p[(i + 1) % 4][0], p[(i + 1) % 4][1], 0.008], C.zone);
      B.label(z.label, z.x + z.w / 2, z.y + z.h / 2, 0.05, "zone");
    }
    // coverage overlay (optional): count = Uint8Array rows*cols from coverage.js
    if (opts.coverage) {
      const { grid: g, count } = opts.coverage;
      B.group("Couverture", { layer: "coverage", transparent: true });
      const cb = hex("#ef4444", 0.42), c1 = hex("#f59e0b", 0.32), c2 = hex("#22c55e", 0.32);
      for (let r = 0; r < g.rows; r++) for (let c = 0; c < g.cols; c++) {
        const i = r * g.cols + c;
        if (!g.walkable[i]) continue;
        const n = count[i], col = n === 0 ? cb : n === 1 ? c1 : c2, s = g.cell, z = 0.012;
        const x0 = c * s, y0 = r * s;
        B.quad([x0, y0, z], [x0 + s, y0, z], [x0 + s, y0 + s, z], [x0, y0 + s, z], [0, 0, 1], col);
      }
    }
    const groups = B.groups.filter(g => g.p.length).map(g => ({
      name: g.name, kind: g.kind, transparent: g.transparent, layer: g.layer, camId: g.camId,
      positions: new Float32Array(g.p), normals: new Float32Array(g.n), colors: new Float32Array(g.c),
    }));
    return { groups, labels: B.labels, bounds: { width: W, depth: H, height: RH } };
  }

  // ------------------------------------------------------------------ export: GLB (glTF 2.0 binary) and OBJ
  function toGLB(scene, opts) {
    opts = opts || {};
    const groups = scene.groups.filter(g => opts.layers ? opts.layers.includes(g.layer) : g.layer !== "grid" && g.layer !== "zones");
    const bufs = [], bufferViews = [], accessors = [], meshes = [], nodes = [];
    let offset = 0;

      const bytes = new Uint8Array(arr.buffer, arr.byteOffset, arr.byteLength);

      if (comps === 3) {

        acc.min = mn; acc.max = mx;

    for (const g of groups) {
      const attributes = { POSITION: add(g.positions, 3, 34962), COLOR_0: add(g.colors, 4, 34962) };
      if (g.kind !== "lines") attributes.NORMAL = add(g.normals, 3, 34962);
      meshes.push({ name: g.name, primitives: [{ attributes, mode: g.kind === "lines" ? 1 : 4, material: g.transparent ? 1 : 0 }] });
      nodes.push({ name: g.name, mesh: meshes.length - 1 });
    }
    const gltf = {
      asset: { version: "2.0", generator: "ErgoTwin Eyes scene3d.js" },
      scene: 0, scenes: [{ name: scene.name || "Atelier", nodes: nodes.map((_, i) => i) }], nodes, meshes,
      materials: [
        { name: "opaque", pbrMetallicRoughness: { baseColorFactor: [1, 1, 1, 1], metallicFactor: 0, roughnessFactor: 0.85 }, doubleSided: true },
        { name: "translucent", pbrMetallicRoughness: { baseColorFactor: [1, 1, 1, 1], metallicFactor: 0, roughnessFactor: 0.9 }, doubleSided: true, alphaMode: "BLEND" },
      ],
      accessors, bufferViews, buffers: [{ byteLength: offset }],
    };
    let json = new TextEncoder().encode(JSON.stringify(gltf));
    const jpad = (4 - (json.length % 4)) % 4;
    const jsonChunk = new Uint8Array(json.length + jpad); jsonChunk.set(json); jsonChunk.fill(0x20, json.length);
    const total = 12 + 8 + jsonChunk.length + 8 + offset;
    const out = new Uint8Array(total), dv = new DataView(out.buffer);
    dv.setUint32(0, 0x46546C67, true); dv.setUint32(4, 2, true); dv.setUint32(8, total, true);
    dv.setUint32(12, jsonChunk.length, true); dv.setUint32(16, 0x4E4F534A, true); out.set(jsonChunk, 20);
    let o = 20 + jsonChunk.length;
    dv.setUint32(o, offset, true); dv.setUint32(o + 4, 0x004E4942, true); o += 8;
    for (const b of bufs) { out.set(b, o); o += b.length; }
    return out;
  }

  function toOBJ(scene, opts) {
    opts = opts || {};
    const lines = ["# ErgoTwin Eyes - floor model (meters, Y up). Vertex colours: v x y z r g b"];
    let base = 1;

      const today = S.expoW[w.pid], idxT = E.zoneIndex(today, S.layout.microPause);
      const sym = {}; E.ZK.forEach(z => { sym[z] = Math.round(100 * hist.reduce((t, h) => t + h.sympt[k][z], 0) / hist.length); });

      const Sx = {}; E.ZK.forEach(z => { Sx[z] = Math.round(hist.reduce((t, h) => t + h.day.wIdx[k][z], 0) / hist.length); });
      const rec = (S.layout.microPause || 0) / 10, f = 1.15 - 0.15 * Math.min(rec, 1);
      const R = {}; E.ZK.forEach(z => { R[z] = Math.round(Math.min(100, (0.6 * Sx[z] + 0.4 * sym[z]) * f)); });
      const top = E.ZK.reduce((a, z) => (R[z] > R[a] ? z : a), "poignet");
      return { w, k, today, idxT, sym, Sx, R, top, F: flags(hist[hist.length - 1].day.perW[k], w.anc), trend: hist.map(h => h.sympt[k][top] ? 1 : 0), ans: S.answers.filter(a => a.pid === w.pid) };

  }
  function render() {

            '<div class="det"><p class="note">Antécédents : ' + d.w.hist + "</p>" + ["poignet", "coude", "epaule", "cou"].map(z => '<div class="zline"><b>' + E.ZONES[z].n + '</b> <span class="bdg ' + E.level(d.R[z]) + '">' + d.R[z] + "</span><small>Sollicitation S " + d.Sx[z] + " · symptômes C " + d.sym[z] + " % · aujourd'hui " + d.idxT[z] + "</small>" + ((d.F[z] || []).map(f => '<span class="fl on">' + f + "</span>").join("") || (d.F[z] ? '<span class="fl">Aucun seuil de tableau atteint</span>' : "")) + "</div>").join("") +

            (d.ans.length ? '<p class="note">Questionnaire du jour : ' + d.ans.map(a => "douleur " + (a.douleur ? "oui" : "non") + " ; " + (Object.keys(a.zones).map(z => E.ZONES[z].n + (a.zones[z] ? " +" : " –")).join(", ") || "pas de question ciblée")).join(" | ") + "</p>" : "") +

    }
  }
  function mount(el) { root = el; render(); }
  G.Doctor = { mount, render };
})(window);

    Object.keys(N).forEach(k => { const [x, y, w, l, st] = N[k]; s += '<g class="nd" id="n-' + k.replace(/\W/g, "") + '"><rect x="' + x + '" y="' + y + '" width="' + w + '" height="52" rx="9"/><text x="' + (x + 10) + '" y="' + (y + 21) + '" class="t1">' + l + '</text><text x="' + (x + 10) + '" y="' + (y + 39) + '" class="t2">' + st + '</text><text x="' + (x + w - 10) + '" y="' + (y + 21) + '" class="cnt" text-anchor="end" id="c-' + k.replace(/\W/g, "") + '">0</text></g>'; });

    Object.keys(N).forEach(k => { const el = root && root.querySelector("#c-" + k.replace(/\W/g, "")); if (el) el.textContent = C.COUNT[k] || 0; });
  }
  function renderLog() {
    if (!logBox) return;

  }
  const PINS = [["VIN 5V", "3 · VIN (4,2–6 V)", "#d33"], ["GND", "6 · GND", "#111"], ["GPIO16 · RX2", "4 · TX (TTL 3,3 V)", "#d9a400"], ["GPIO17 · TX2", "5 · RX", "#2a9d5c"], ["GPIO4 · réveil", "2 · Sout (doigt posé)", "#2f6fd0"], ["3V3", "1 · Vtouch 3,3 V", "#e07b00"]];
  const WIRING = `<svg viewBox="0 0 820 330" class="wiring">
  <text x="130" y="22" text-anchor="middle" class="h">ESP32-DevKitC (WROOM-32)</text><rect x="20" y="34" width="220" height="200" rx="10" class="pcb"/>
  <text x="690" y="22" text-anchor="middle" class="h">Lecteur d'empreinte R307</text><rect x="560" y="34" width="250" height="200" rx="10" class="sensor"/>
  ${PINS.map((r, i) => { const y = 64 + i * 28; return `<text x="228" y="${y + 4}" text-anchor="end" class="w">${r[0]}</text><circle cx="240" cy="${y}" r="4.5" fill="${r[2]}"/><path d="M240 ${y} C 400 ${y}, 400 ${y}, 560 ${y}" stroke="${r[2]}" stroke-width="2.6" fill="none"/><circle cx="560" cy="${y}" r="4.5" fill="${r[2]}"/><text x="574" y="${y + 4}" class="w">${r[1]}</text>`; }).join("")}

// ErgoTwin Lancement — assemblage : navigation, horloge de démonstration, synchronisation entre onglets.
(function (G) {
  "use strict";
  const E = G.Engine, C = G.Core, S = C.S, $ = id => document.getElementById(id);
  const VIEWS = { kiosk: "Tablette atelier", engineer: "Ingénieur 🔒", doctor: "Médecin 🔒", liaison: "Liaison des systèmes" };
  let cur = "kiosk";
  function go(v) {
    cur = v; document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
    document.querySelectorAll(".view").forEach(s => (s.hidden = s.id !== "v-" + v));
    if (v === "engineer") G.Engineer.render(); if (v === "doctor") G.Doctor.render();
    try { if (location.hash.slice(1) !== v) history.replaceState(null, "", "#" + v); } catch (e) { /* cadre isolé */ }
  }
  function boot() {
    $("nav").innerHTML = Object.keys(VIEWS).map(k => '<button data-v="' + k + '">' + VIEWS[k] + "</button>").join("");
    $("nav").querySelectorAll("button").forEach(b => (b.onclick = () => go(b.dataset.v)));
    G.Twin.computeVisibility();
    G.Kiosk.mount($("v-kiosk")); G.Engineer.mount($("v-engineer")); G.Doctor.mount($("v-doctor")); G.Liaison.mount($("v-liaison"));
    C.fastForward(10 * 60 + 15);   // la démo s'ouvre en milieu de matinée, avec les données du jour déjà accumulées
    const sp = $("speed");
    sp.onchange = () => (S.speed = +sp.value);
    $("play").onclick = () => { S.running = !S.running; $("play").textContent = S.running ? "⏸" : "▶"; };
    $("eod").onclick = () => { C.fastForward(16 * 60 + 55); };
    setInterval(() => { $("clock").textContent = C.hhmm(S.clock); $("phase").textContent = S.clock >= E.DAY.lunch[0] && S.clock < E.DAY.lunch[1] ? "pause déjeuner" : S.clock >= E.DAY.end ? "fin de journée" : "production"; }, 300);
    // synchronisation entre onglets (tablette dans un onglet, dashboard dans un autre)
    try { const ch = new BroadcastChannel("ergotwin-lancement"); ch.onmessage = ev => { const m = ev.data; if (m && m.topic === "lancement/pointage" && m.payload) { const p = m.payload; if (p.action === "sortie") { S.assign[p.pid] = null; S.out[p.pid] = true; } else if (p.action === "pause") S.paused[p.pid] = true; else if (p.action === "reprise") S.paused[p.pid] = false; else if (p.station) { const o = C.occupant(p.station); if (o && o !== p.pid) S.assign[o] = null; S.assign[p.pid] = p.station; S.paused[p.pid] = false; } } }; } catch (e) { /* non supporté */ }
    C.start();
    const h = (location.hash || "").slice(1); go(VIEWS[h] ? h : "kiosk");
    window.addEventListener("hashchange", () => { const k = location.hash.slice(1); if (VIEWS[k] && k !== cur) go(k); });
  }
  document.addEventListener("DOMContentLoaded", boot);
})(window);
</script>
